<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1DB954;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0E7C32;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0A4D1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#052612;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0D1B12" stroke="#1DB954" stroke-width="8"/>

  <!-- Tower base -->
  <circle cx="256" cy="256" r="140" fill="url(#towerGrad)" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#0E7C32" stroke-width="4"/>

  <!-- Tower core -->
  <circle cx="256" cy="256" r="80" fill="url(#coreGrad)" />
  <circle cx="256" cy="256" r="80" fill="none" stroke="#1DB954" stroke-width="2"/>

  <!-- Health ring indicator -->
  <path d="M 256 116 A 140 140 0 0 1 396 256" fill="none" stroke="#1DB954" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

  <!-- Accent ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1DB954" stroke-width="2" opacity="0.4" stroke-dasharray="20,10"/>

  <!-- Orbiting orbs (3 dots) -->
  <circle cx="256" cy="100" r="12" fill="#1DB954" opacity="0.9"/>
  <circle cx="400" cy="256" r="12" fill="#1DB954" opacity="0.9"/>
  <circle cx="256" cy="412" r="12" fill="#1DB954" opacity="0.9"/>

  <!-- Center glow -->
  <circle cx="256" cy="256" r="40" fill="#1DB954" opacity="0.2"/>
</svg>